  <title id="agentpaw-settings-mono-title">AgentPaw settings</title>

  <!--
    AgentPaw Settings Logo, single-colour variant.

    Gear and paw print are one flat colour driven by `currentColor`, which is
    what you want inside menus / toolbars / config panels: the icon simply
    follows the content colour of its slot and themes for free.

    Geometry is identical to agentpaw-settings.svg. Exported PNGs:
      agentpaw-settings-mono-black-*.png  (#000000)
      agentpaw-settings-mono-white-*.png  (#FFFFFF)
  -->
