  <title id="agentpaw-wordmark-title">AgentPaw</title>

  <!--
    AgentPaw App Logo, horizontal wordmark lock-up.

    Left: the icon at 112px, straight from agentpaw-logo.svg
    (scale 0.21875). Right: "AgentPaw" set in Inter SemiBold and converted
    to outlines, so the file has zero font dependencies. The lettering is
    `currentColor` (default ink #18181B) — set color:#FFFFFF on dark
    surfaces, as done in agentpaw-logo-wordmark-mono-white-*.png.

    Canvas 531 x 128; icon keeps its 8.8% safe margin on the left,
    optical gap between icon and lettering is 32px.
  -->
  <defs>
    <linearGradient id="agentpaw-wordmark-gradient" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
