name: Publish agentpaw-core to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0). Leave empty for 0.1.0-SNAPSHOT.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          VERSION=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$DISPATCH_VERSION"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0-SNAPSHOT"
          fi
          echo "Publishing agentpaw-core $VERSION"
          echo "AGENTPAW_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Prepare environment
        run: |
          # Remove local Windows java.home configuration if present
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          chmod +x gradlew

      - name: Build and test library
        run: ./gradlew :agentpaw-core:testReleaseUnitTest --no-daemon --stacktrace

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew :agentpaw-core:publishReleasePublicationToGitHubPackagesRepository
          -Pagentpaw.version="${AGENTPAW_VERSION}" --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentpaw-core-test-reports
          path: agentpaw-core/build/reports/tests/
          retention-days: 7
