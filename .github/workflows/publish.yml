name: Publish agentpaw-core to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.1). Leave empty for 0.1.0-SNAPSHOT.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          VERSION=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$DISPATCH_VERSION"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0-SNAPSHOT"
          fi
          echo "Publishing agentpaw-core $VERSION"
          echo "AGENTPAW_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Prepare environment
        run: |
          # Remove local Windows java.home configuration if present
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          chmod +x gradlew

      - name: Build and test library
        run: ./gradlew :agentpaw-core:testReleaseUnitTest --no-daemon --stacktrace

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew :agentpaw-core:publishReleasePublicationToGitHubPackagesRepository
          -Pagentpaw.version="${AGENTPAW_VERSION}" --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentpaw-core-test-reports
          path: agentpaw-core/build/reports/tests/
          retention-days: 7

  apk-release:
    name: Build debug APK and attach to release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: publish

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          VERSION=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$DISPATCH_VERSION"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0-SNAPSHOT"
          fi
          echo "Building app for version $VERSION"
          echo "AGENTPAW_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Prepare environment
        run: |
          # Remove local Windows java.home configuration if present
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${AGENTPAW_VERSION}"
          case "$VERSION" in
            *-SNAPSHOT)
              echo "Snapshot build ($VERSION): skip creating a GitHub Release."
              exit 0
              ;;
          esac
          APK="app/build/outputs/apk/debug/app-debug.apk"
          ASSET="AgentPaw-v${VERSION}-debug.apk"
          cp "$APK" "$ASSET"
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v${VERSION} exists, uploading asset."
            gh release upload "v${VERSION}" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Creating release v${VERSION} with APK."
            gh release create "v${VERSION}" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AgentPaw v${VERSION}" \
              --generate-notes
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
