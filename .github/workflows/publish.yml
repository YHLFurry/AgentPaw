name: Publish agentpaw-core to GitHub Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.1). Leave empty for 0.1.0-SNAPSHOT.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          VERSION=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$DISPATCH_VERSION"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0-SNAPSHOT"
          fi
          echo "Publishing agentpaw-core $VERSION"
          echo "AGENTPAW_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Prepare environment
        run: |
          # Remove local Windows java.home configuration if present
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          chmod +x gradlew

      - name: Build and test library
        run: ./gradlew :agentpaw-core:testReleaseUnitTest --no-daemon --stacktrace

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./gradlew :agentpaw-core:publishReleasePublicationToGitHubPackagesRepository
          -Pagentpaw.version="${AGENTPAW_VERSION}" --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentpaw-core-test-reports
          path: agentpaw-core/build/reports/tests/
          retention-days: 7

  apk-release:
    name: Build debug APK and attach to release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: publish

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          VERSION=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$DISPATCH_VERSION"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0-SNAPSHOT"
          fi
          echo "Building app for version $VERSION"
          echo "AGENTPAW_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Prepare environment
        run: |
          # Remove local Windows java.home configuration if present
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          chmod +x gradlew

      - name: Setup Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/agentpaw.keystore
          else
            echo "KEYSTORE_BASE64 secret is not set, skipping release signing."
          fi

      - name: Build APKs
        env:
          AGENTPAW_STORE_FILE: app/agentpaw.keystore
          AGENTPAW_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          AGENTPAW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          AGENTPAW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "app/agentpaw.keystore" ] && [ -n "$AGENTPAW_STORE_PASSWORD" ]; then
            echo "Signing credentials present: building both Release and Debug APKs..."
            ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace
          else
            echo "Building Debug APK only..."
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${AGENTPAW_VERSION}"
          case "$VERSION" in
            *-SNAPSHOT)
              echo "Snapshot build ($VERSION): skip creating a GitHub Release."
              exit 0
              ;;
          esac

          FILES_TO_UPLOAD=()

          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            RELEASE_ASSET="AgentPaw-v${VERSION}.apk"
            cp "app/build/outputs/apk/release/app-release.apk" "$RELEASE_ASSET"
            FILES_TO_UPLOAD+=("$RELEASE_ASSET")
          fi

          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            DEBUG_ASSET="AgentPaw-v${VERSION}-debug.apk"
            cp "app/build/outputs/apk/debug/app-debug.apk" "$DEBUG_ASSET"
            FILES_TO_UPLOAD+=("$DEBUG_ASSET")
          fi

          if [ ${#FILES_TO_UPLOAD[@]} -eq 0 ]; then
            echo "Error: No APK found to attach!"
            exit 1
          fi

          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v${VERSION} exists, uploading assets: ${FILES_TO_UPLOAD[*]}"
            gh release upload "v${VERSION}" "${FILES_TO_UPLOAD[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Creating release v${VERSION} with assets: ${FILES_TO_UPLOAD[*]}"
            gh release create "v${VERSION}" "${FILES_TO_UPLOAD[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AgentPaw v${VERSION}" \
              --generate-notes
          fi

      - name: Clean up Keystore
        if: always()
        run: |
          rm -f app/agentpaw.keystore

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: app/build/outputs/apk/*/*.apk
          retention-days: 14
